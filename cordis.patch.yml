# Патч-слой бандла dsh-a2a-client: вставляет плагин в профиль
# под идентификатором `a2a-client`.
#
# Агенты здесь намеренно не заданы: после установки добавьте своего агента
# в панели «Настройки → A2A» — запись сохранится в профиле и переживёт
# перезапуск. Альтернатива — описать агентов прямо в config, как в примере
# ниже (раскомментируйте и подставьте свои значения).
#
# Токен в файле не храните: у каждого агента своя ссылка на секрет
# A2A_TOKEN_<ИМЯ> (для агента my-agent — A2A_TOKEN_MY_AGENT). Значение живёт в
# хранилище секретов DSH (его пишет панель A2A) или в переменной окружения;
# поле `token` нужно только для записей, сделанных раньше, и читается последним.
# Если токен всё же нужен в файле — держите его в локальной копии
# cordis.patch.local.yml: она в .gitignore и в репозиторий не попадает.
- insert:
    - id: a2a-client
      name: 'dsh-a2a-client'
      config:
        timeoutMs: 120000
        # defaultAgent: my-agent
        # agents:
        #   - name: my-agent
        #     cardUrl: https://agent.example.com/.well-known/agent-card.json
        #     tokenEnv: A2A_AUTH_TOKEN
        #     timeoutMs: 120000
