# Патч-слой бандла @local/dsh-a2a-client: вставляет плагин в профиль
# под идентификатором `a2a-client`.
#
# Агенты здесь намеренно не заданы: после установки добавьте своего агента
# в панели «Настройки → A2A» — запись сохранится в профиле и переживёт
# перезапуск. Альтернатива — описать агентов прямо в config, как в примере
# ниже (раскомментируйте и подставьте свои значения).
#
# Токен в файле не храните: значение берётся из переменной окружения, имя
# которой задаёт `tokenEnv` (по умолчанию A2A_AUTH_TOKEN). Переменная важнее
# поля `token`. Если токен всё же нужен в файле — держите его в локальной
# копии cordis.patch.local.yml: она в .gitignore и в репозиторий не попадает.
- insert:
    - id: a2a-client
      name: '@local/dsh-a2a-client'
      config:
        timeoutMs: 120000
        # defaultAgent: my-agent
        # agents:
        #   - name: my-agent
        #     cardUrl: https://agent.example.com/.well-known/agent-card.json
        #     tokenEnv: A2A_AUTH_TOKEN
        #     timeoutMs: 120000
