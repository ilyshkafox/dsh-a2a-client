name: Release

# Публикует GitHub Release, а не пуш тега: релиз — единственное действие,
# которое отправляет пакет в npm, поэтому в npm попадает ровно то, что
# выпущено. Тег можно создать и без релиза — публикации не будет.
#
# Аутентификация — npm trusted publishing (OIDC): секрета NPM_TOKEN нет, npm
# сам прикладывает provenance, потому что репозиторий публичный. Доверие
# настраивается один раз на странице пакета:
#   npmjs.com → dsh-a2a-client → Settings → Trusted Publisher
#     provider           GitHub Actions
#     organization/user  ilyshkafox
#     repository         dsh-a2a-client
#     workflow filename  release.yml
#     allowed action     npm publish
#
# Файл workflow должен быть в ветке по умолчанию, иначе событие release его не
# найдёт, а тег релиза обязан совпадать с версией в package.json.

on:
  release:
    types: [published]
  # Повторить упавшую публикацию без нового релиза: версия берётся из
  # package.json, потому что у ручного запуска тега нет.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

# Два релиза подряд не должны гоняться за одну версию.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Check JavaScript syntax
        run: npm run check

      - name: Locale and security suites
        run: npm test

      - name: Release tag must match the package version
        if: github.event_name == 'release'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          echo "tag: $tag, package.json: $version"
          if [ "$tag" != "$version" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME does not match package version $version"
            exit 1
          fi

      - name: Publish to npm
        run: |
          version="$(node -p "require('./package.json').version")"
          name="$(node -p "require('./package.json').name")"

          # Повторный запуск релиза не должен падать на уже ушедшей версии.
          if npm view "${name}@${version}" version >/dev/null 2>&1; then
            echo "${name}@${version} is already on npm; nothing to do."
            exit 0
          fi

          # Пререлиз не должен забирать тег latest: именно его ставит
          # `dsh plugin add`.
          if [[ "${version}" == *-* ]]; then
            echo "publishing ${name}@${version} under the next tag"
            npm publish --tag next
          else
            npm publish
          fi

      - name: Report what npm now serves
        run: |
          name="$(node -p "require('./package.json').name")"
          npm view "${name}" version dist-tags
